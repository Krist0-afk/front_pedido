server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # index.html nunca se cachea: es quien apunta a los bundles nuevos tras un
    # despliegue. Si se cachea, el navegador sigue pidiendo los chunks viejos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los bundles llevan hash en el nombre (outputHashing: all), así que un
    # nombre de archivo identifica su contenido para siempre.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El router de Angular usa la History API: /carrito o /perfil no existen
    # como archivos. Cualquier ruta desconocida devuelve index.html para que
    # sea Angular quien resuelva la navegación, en vez de un 404 de nginx.
    # Es también lo que permite volver desde el redirect de Entra ID.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
