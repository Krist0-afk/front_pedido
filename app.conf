root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

location = /index.html {
    add_header Cache-Control "no-cache";
}

# Los bundles llevan hash en el nombre (outputHashing: all).
location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# /carrito y /perfil no existen como archivos: los resuelve el router, y es
# también lo que permite volver del redirect de Entra ID.
location / {
    try_files $uri $uri/ /index.html;
}
