root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

location = /index.html {
    add_header Cache-Control "no-cache";
}

# Los bundles llevan hash en el nombre (outputHashing: all).
location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# WebSocket del dashboard: el API Gateway HTTP no maneja WebSockets, así que nginx lo
# reenvía a la EC2 de analítica (ANALYTICS_UPSTREAM, se define al levantar el contenedor).
location /api/v1/analytics/ws {
    proxy_pass http://${ANALYTICS_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 1h;
}

# /carrito y /perfil no existen como archivos: los resuelve el router, y es
# también lo que permite volver del redirect de Entra ID.
location / {
    try_files $uri $uri/ /index.html;
}
